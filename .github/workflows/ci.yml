name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: API tests and Allure report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: bash ./gradlew clean test

      - name: Generate Allure report
        if: always()
        run: bash ./gradlew allureReport

      - name: Upload Allure report and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            build/reports/allure-report/allureReport/
            build/allure-results/
          if-no-files-found: warn
          retention-days: 14
